function _fechaDeCelda(v) {
  if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    const dt = new Date(Math.round(Date.UTC(1899, 11, 30) + v * 86400000));
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  const s = String(v || '').trim();
  let m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return { y, m: +m[2], d: +m[1] }; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2], d: +m[3] };
  return null;
}
function _horarioDeCelda(v) {
  const s = String(v || '');
  const m = s.match(/(\d{1,2})\s*[:.hH]\s*(\d{2})\s*(?:a|al|-|–|—|hasta)\s*(\d{1,2})\s*[:.hH]\s*(\d{2})/i);
  if (!m) return null;
  const h1 = +m[1], n1 = +m[2], h2 = +m[3], n2 = +m[4];
  if (h1 > 23 || h2 > 23 || n1 > 59 || n2 > 59) return null;
  return { h1, n1, h2, n2, dur: (h2 * 60 + n2) - (h1 * 60 + n1) };
}
function matchProfesor(nombre, profs) {
  const n = normTxt(nombre);
  if (!n) return null;
  const ex = profs.find(p => normTxt(p.name) === n);
  if (ex) return ex;
  const tk = n.split(' ').filter(Boolean);
  const cand = profs.filter(p => {
    const pt = normTxt(p.name).split(' ').filter(Boolean);
    const [a, b] = tk.length <= pt.length ? [tk, pt] : [pt, tk];
    return a.length >= 2 && a.every(t => b.includes(t));
  });
  return cand.length === 1 ? cand[0] : null;
}

const GAP_CORTE = 30; // minutos: un hueco o pausa de 30 min o más separa un bloque de otro (almuerzo)
const RE_BREAK = /^(almuerzo|colacion|break|receso|descanso|pausa)\b/;
const _mm = (h, n) => h * 60 + n;
const _hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const _ymd = f => `${f.y}-${String(f.m).padStart(2, '0')}-${String(f.d).padStart(2, '0')}`;
const _p2 = n => String(n).padStart(2, '0');

/* Agrupa las filas del Excel en BLOQUES SENCE (mañana / tarde). Cada bloque = una sesión SENCE del alumno.
   Dentro del bloque, cada asignatura es un "tramo" con su profesor. El almuerzo corta el bloque. */
function construirBloques(rows, almDef) {
  const porDia = new Map();
  rows.filter(r => r.start && r.h && r.h.dur > 0 && !r.errores.length).forEach(r => {
    if (!porDia.has(r.day)) porDia.set(r.day, []);
    porDia.get(r.day).push(r);
  });
  const out = [];
  [...porDia.keys()].sort().forEach(day => {
    const rs = porDia.get(day);
    const f = rs[0].f;
    let breaks = rs.filter(r => r.esBreak && (r.b - r.a) >= GAP_CORTE).map(r => ({ a: r.a, b: r.b }));
    const cortos = rs.filter(r => r.esBreak && (r.b - r.a) < GAP_CORTE).length;
    const segsIn = rs.filter(r => !r.esBreak).sort((x, y) => x.a - y.a);
    if (!segsIn.length) return;
    const minA = Math.min(...segsIn.map(s => s.a)), maxB = Math.max(...segsIn.map(s => s.b));
    let usoAlmDef = false;
    // si el propio horario ya trae un hueco de 30 min o más, ese hueco es el almuerzo: no se aplica el valor por defecto
    const hayHueco = segsIn.some((sg, i) => i > 0 && sg.a - Math.max(...segsIn.slice(0, i).map(x => x.b)) >= GAP_CORTE);
    if (!breaks.length && !hayHueco && almDef && minA < almDef.a && maxB > almDef.b) {
      breaks = [{ a: almDef.a, b: almDef.b }]; usoAlmDef = true;
    }
    let piezas = segsIn.map(s => ({ a: s.a, b: s.b, asig: s.asig, cap: s.cap, capUid: s.capUid, av: s.avisos, codMod: s.codMod, fila: s.fila, dividido: false }));
    breaks.sort((x, y) => x.a - y.a).forEach(br => {
      const np = [];
      piezas.forEach(p => {
        if (p.b <= br.a || p.a >= br.b) { np.push(p); return; }
        if (p.a < br.a) np.push({ ...p, b: br.a, dividido: true });
        if (p.b > br.b) np.push({ ...p, a: br.b, dividido: true });
      });
      piezas = np;
    });
    piezas.sort((x, y) => x.a - y.a || x.b - y.b);
    const grupos = []; let cur = null;
    piezas.forEach(p => {
      const corta = cur && (p.a - cur.b >= GAP_CORTE || breaks.some(br => cur.b <= br.a && p.a >= br.b));
      if (!cur || corta) { cur = { segs: [], a: p.a, b: p.b }; grupos.push(cur); }
      cur.segs.push(p); cur.b = Math.max(cur.b, p.b);
    });
    grupos.forEach((g, i) => {
      const start = new Date(f.y, f.m - 1, f.d, Math.floor(g.a / 60), g.a % 60);
      const dur = g.b - g.a;
      const net = g.segs.reduce((s, p) => s + (p.b - p.a), 0);
      let franja;
      if (grupos.length === 2) franja = i === 0 ? 'Mañana' : 'Tarde';
      else if (grupos.length === 1) franja = (g.a < 780 && g.b > 840) ? 'Jornada completa' : (g.a < 780 ? 'Mañana' : 'Tarde');
      else franja = 'Bloque ' + (i + 1);
      const asigs = [...new Set(g.segs.map(p => p.asig))];
      const avisos = [];
      if (dur > 360) avisos.push(`Bloque continuo de ${Math.round(dur / 6) / 10} h: ¿falta el almuerzo?`);
      for (let k = 1; k < g.segs.length; k++) if (g.segs[k].a < g.segs[k - 1].b) { avisos.push('Tramos traslapados'); break; }
      g.segs.forEach(p => (p.av || []).forEach(x => { if (!avisos.includes(x)) avisos.push(x); }));
      if (cortos) avisos.push('Hay un break corto (<30 min): no separa el bloque');
      if (usoAlmDef) avisos.push('Almuerzo aplicado por defecto');
      if (g.segs.some(p => p.dividido)) avisos.push('Una asignatura se dividió por el almuerzo');
      if (start < new Date(new Date().setHours(0, 0, 0, 0))) avisos.push('Fecha pasada');
      out.push({ day, start, a: g.a, b: g.b, dur, net, franja, segs: g.segs, avisos, dup: false,
        title: `${franja} — ${asigs.join(' / ')}`.slice(0, 150) });
    });
  });
  return out;
}

async function previsualizarImportacion() {
  const curso = document.getElementById('im_curso').value.trim();
  const linea = parseInt(document.getElementById('im_linea').value);
  const codSence = document.getElementById('im_codSence').value.trim();
  const codigoCurso = document.getElementById('im_codigoCurso').value.trim();
  const codModDef = document.getElementById('im_codModulo').value.trim();
  const videoType = document.getElementById('im_videoType').value;
  const videoUrl = document.getElementById('im_videoUrl').value.trim();
  const almTxt = (document.getElementById('im_almuerzo')?.value || '').trim();
  const file = document.getElementById('im_file').files[0];
  const box = document.getElementById('im_preview');

  if (!curso) return toast('⚠️ Indica el nombre del curso.', 'warning');
  if (!slugCurso(curso)) return toast('⚠️ El nombre del curso debe tener letras o números.', 'warning');
  const eSence = validarCamposSence(linea, codSence, codigoCurso, codModDef);
  if (eSence) return toast('⚠️ ' + eSence, 'warning', 6000);
  if (videoType !== 'jitsi' && !/^https:\/\//i.test(videoUrl)) return toast('⚠️ Ingresa la URL (https://) de la videoconferencia.', 'warning');
  if (videoType !== 'jitsi' && urlEsJitsiPropia(videoUrl)) return toast('⚠️ Las salas de meet.inasep.cl se configuran con el tipo "Jitsi", no con una URL.', 'warning', 6000);
  let almDef = null;
  if (almTxt) {
    const ha = _horarioDeCelda(almTxt);
    if (!ha || ha.dur < GAP_CORTE) return toast('⚠️ Hora de almuerzo inválida (ej: 13:00 a 14:00, mínimo 30 min).', 'warning');
    almDef = { a: _mm(ha.h1, ha.n1), b: _mm(ha.h2, ha.n2) };
  }
  if (!file) return toast('⚠️ Selecciona el archivo Excel.', 'warning');
  if (typeof XLSX === 'undefined') return toast('❌ No se cargó la librería de Excel. Recarga la página (Ctrl+F5).', 'error');

  box.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Leyendo archivo...</p></div>';
  let aoa;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  } catch (e) { box.innerHTML = ''; return toast('❌ No se pudo leer el archivo: ' + e.message, 'error'); }

  const hi = aoa.findIndex(r => r.some(c => normTxt(c) === 'fecha'));
  if (hi < 0) { box.innerHTML = ''; return toast('❌ No encontré la columna "Fecha" en el archivo.', 'error', 6000); }
  const col = { fecha: -1, horario: -1, asig: -1, cap: -1, mod: -1 };
  aoa[hi].forEach((h, i) => {
    const t = normTxt(h);
    if (t.includes('codigo') && t.includes('modulo')) col.mod = i;
    else if (t.includes('fecha')) col.fecha = i;
    else if (t.includes('horario') || t === 'hora') col.horario = i;
    else if (t.includes('asignatura') || t.includes('materia') || t.includes('modulo')) col.asig = i;
    else if (t.includes('capacitador') || t.includes('profesor') || t.includes('docente') || t.includes('relator')) col.cap = i;
  });
  const faltan = ['fecha', 'horario', 'asig', 'cap'].filter(k => col[k] < 0);
  if (faltan.length) { box.innerHTML = ''; return toast('❌ Faltan columnas: ' + faltan.map(k => ({ fecha: 'Fecha', horario: 'Horario clases', asig: 'Asignatura', cap: 'Nombre del capacitador' })[k]).join(', '), 'error', 7000); }

  const profs = await cargarProfesoresLista();
  const cursoId = slugCurso(curso);
  const malla = await cargarMalla(cursoId);
  const mIdx = new Map((malla?.asignaturas || []).map(a => [normTxt(a.nombre), a]));
  const existentes = new Set();
  const exSnap = await db.collection('liveClasses').where('cursoId', '==', cursoId).get();
  exSnap.docs.forEach(d => { const c = d.data(); existentes.add(c.scheduledAt?.toMillis?.()); });

  const rows = [];
  for (let i = hi + 1; i < aoa.length; i++) {
    const r = aoa[i];
    if (r.every(c => String(c).trim() === '')) continue;
    const fila = i + 1, errores = [], avisos = [];
    const f = _fechaDeCelda(r[col.fecha]);
    const h = _horarioDeCelda(r[col.horario]);
    const asig = String(r[col.asig] || '').trim();
    const esBreak = RE_BREAK.test(normTxt(asig));
    let cap = String(r[col.cap] || '').trim().replace(/\s+/g, ' ');
    const mItem = !esBreak && mIdx.size ? mIdx.get(normTxt(asig)) : null;
    let capUid = '';
    if (mItem) {
      if (!cap && mItem.profesorNombre) { cap = mItem.profesorNombre; capUid = mItem.profesorUid || ''; avisos.push('Profesor tomado de la malla'); }
      else if (cap && mItem.profesorNombre && normTxt(cap) !== normTxt(mItem.profesorNombre) && !(matchProfesor(cap, [{ uid: mItem.profesorUid, name: mItem.profesorNombre }]))) avisos.push(`Profesor distinto del titular (${mItem.profesorNombre})`);
    } else if (!esBreak && mIdx.size) avisos.push(`"${asig}" no está en la malla del curso`);
    const codMod = (col.mod >= 0 ? String(r[col.mod] || '').trim() : '') || mItem?.codModulo || codModDef;
    let start = null;
    if (!f) errores.push('Fecha inválida');
    if (!h) errores.push('Horario inválido (use 09:15 a 17:30)');
    else if (h.dur <= 0) errores.push('La hora de término es anterior al inicio');
    else if (h.dur > 720) errores.push('Duración mayor a 12 horas');
    if (!esBreak && asig.length < 3) errores.push('Falta la asignatura');
    if (f && h) {
      start = new Date(f.y, f.m - 1, f.d, h.h1, h.n1);
      if (isNaN(start) || start.getMonth() !== f.m - 1) { errores.push('Fecha inexistente'); start = null; }
    }
    if (!esBreak && linea === 1 && !codMod) errores.push('Falta código de módulo SIC');
    if (!esBreak && !cap) avisos.push('Sin capacitador');
    rows.push({ fila, f, h, start, asig, cap, capUid, codMod, errores, avisos, esBreak,
      day: f ? _ymd(f) : '', a: h ? _mm(h.h1, h.n1) : 0, b: h ? _mm(h.h2, h.n2) : 0 });
  }
  const bloques = construirBloques(rows, almDef);
  bloques.forEach(b => { b.dup = existentes.has(b.start.getTime()); });

  const mapa = {};
  bloques.forEach(b => b.segs.forEach(p => { if (p.cap && !(p.cap in mapa)) mapa[p.cap] = p.capUid || matchProfesor(p.cap, profs)?.uid || ''; }));
  _imp = { rows, bloques, profs, mapa, curso, cursoId, linea, codSence, codigoCurso, videoType, videoUrl };
  renderPreviewImportacion();
}

async function ejecutarImportacion() {
  const { bloques, profs, mapa, curso, cursoId, linea, codSence, codigoCurso, videoType, videoUrl } = _imp;
  const lista = bloques.filter(b => !b.dup);
  if (!lista.length) return;
  if (!confirm(`¿Crear ${lista.length} bloques del curso "${curso}"?`)) return;
  const btn = document.getElementById('btnImportar'); btn.disabled = true; btn.textContent = 'Creando...';
  const lote = 'imp-' + Date.now();
  try {
    for (let i = 0; i < lista.length; i += 400) {
      const batch = db.batch();
      lista.slice(i, i + 400).forEach(b => {
        const segmentos = b.segs.map(p => {
          const prof = profs.find(x => x.uid === mapa[p.cap]);
          return { titulo: p.asig, ini: _hhmm(p.a), fin: _hhmm(p.b), durMin: p.b - p.a, profesorUid: prof?.uid || '', profesorNombre: prof?.name || p.cap || '', codModulo: p.codMod || '' };
        });
        const uids = [...new Set(segmentos.map(s => s.profesorUid).filter(Boolean))];
        const nombres = [...new Set(segmentos.map(s => s.profesorNombre).filter(Boolean))];
        // UNA sala por día y curso: mañana y tarde usan el mismo enlace; los relevos de profesor no cierran la sala
        const room = `inasep-${cursoId}-${b.start.getFullYear()}${_p2(b.start.getMonth() + 1)}${_p2(b.start.getDate())}`.slice(0, 80);
        batch.set(db.collection('liveClasses').doc(), {
          title: b.title, courseName: curso, cursoId,
          description: segmentos.map(s => `${s.ini}-${s.fin} ${s.titulo}${s.profesorNombre ? ' (' + s.profesorNombre + ')' : ''}`).join(' | ').slice(0, 900),
          scheduledAt: firebase.firestore.Timestamp.fromDate(b.start),
          duration: b.dur, duracionNeta: b.net, segmentos,
          codSence: linea === 1 ? '' : codSence, codigoCurso, codigoModulo: segmentos[0]?.codModulo || '', lineaCapacitacion: linea,
          status: 'scheduled', videoType,
          videoUrl: videoType === 'jitsi' ? '' : videoUrl,
          jitsiRoom: videoType === 'jitsi' ? room : '',
          capacidadEstimada: 0,
          profesoresUids: uids, profesorUid: uids[0] || '', profesorNombre: nombres.join(', '),
          importLote: lote,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
      });
      await batch.commit();
    }
    toast(`✅ ${lista.length} bloques creados. Ahora matricula a los alumnos del curso.`, 'success', 7000);
    navigate('matriculas');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Reintentar';
    toast('❌ Error al crear: ' + e.message, 'error', 8000);
  }
}

/* Tramos del bloque (agenda) — usado en sala del alumno y del profesor */
function htmlTramos(cls) {
  const sg = cls.segmentos;
  if (!sg || !sg.length || !cls.scheduledAt) return '';
  const base = cls.scheduledAt.toDate();
  const now = new Date();
  const toD = t => { const [h, m] = String(t).split(':').map(Number); return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m); };
  return `<div class="card"><div class="card-header"><h3>🗓️ Tramos de este bloque</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Horario</th><th>Asignatura</th><th>Profesor</th></tr></thead><tbody>
    ${sg.map(s => { const act = now >= toD(s.ini) && now < toD(s.fin); return `<tr style="${act ? 'background:var(--green-50);font-weight:600' : ''}">
      <td style="font-family:'DM Mono'">${escHtml(s.ini)}–${escHtml(s.fin)}</td>
      <td>${escHtml(s.titulo)} ${act ? '<span class="badge badge-live">ahora</span>' : ''}</td><td>${escHtml(s.profesorNombre || '—')}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}

/* ════════════════════════════════════════════════
   BLOQUE: iniciar / cerrar (Worker fija la hora oficial)
════════════════════════════════════════════════ */
async function bloqueAccion(accion, classId) {
  const res = await workerFetch('/api/bloque/' + accion, { method: 'POST', body: JSON.stringify({ classId }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('Error del servidor (' + res.status + ')'));
  return j;
}

/* Alumno: escucha el estado del bloque (1 documento) */
let _claseListener = null, _avisoCierreTimer = null, _avisoClassId = '';
function escucharEstadoClase(classId, estadoInicial, attId) {
  if (_claseListener) { _claseListener(); _claseListener = null; }
  let prev = estadoInicial;
  _claseListener = db.collection('liveClasses').doc(classId).onSnapshot(doc => {
    if (!doc.exists) return;
    const st = doc.data().status;
    if (st === prev) return;
    const antes = prev; prev = st;
    if (st === 'active') {
      toast('🔴 El profesor inició el bloque. Ya puedes registrar tu sesión SENCE.', 'success', 9000);
      if (currentView === 'class-room') navigate('class-room', { id: classId });
    } else if (st === 'finished' && antes === 'active') {
      if (attId) { _avisoClassId = classId; mostrarAvisoCierre(attId); }
      else if (currentView === 'class-room') navigate('class-room', { id: classId });
    }
  }, e => console.warn('estado clase', e.message));
}
function mostrarAvisoCierre(attId) {
  if (_avisoCierreTimer) clearInterval(_avisoCierreTimer);
  let n = 20;
  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay"><div class="modal" role="alertdialog" aria-live="assertive" aria-label="El profesor cerró el bloque">
      <h3>🔔 El profesor cerró el bloque</h3>
      <p style="margin:10px 0">Debes <strong>cerrar tu sesión SENCE</strong> para registrar tu salida.</p>
      <p style="font-size:15px">Te llevaremos a SENCE en <strong id="avisoCd">${n}</strong> segundos…</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="cancelarAvisoCierre()">Cancelar</button>
        <button class="btn btn-sence" onclick="cerrarSesionDesdeAviso('${attId}')">🇨🇱 Cerrar sesión SENCE ahora</button>
      </div></div></div>`;
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  _avisoCierreTimer = setInterval(() => {
    n--; const el = document.getElementById('avisoCd'); if (el) el.textContent = n;
    if (n <= 0) cerrarSesionDesdeAviso(attId);
  }, 1000);
}
function cancelarAvisoCierre() {
  if (_avisoCierreTimer) { clearInterval(_avisoCierreTimer); _avisoCierreTimer = null; }
  closeModal();
  if (_avisoClassId && currentView === 'class-room') navigate('class-room', { id: _avisoClassId });
}
function cerrarSesionDesdeAviso(attId) {
  if (_avisoCierreTimer) { clearInterval(_avisoCierreTimer); _avisoCierreTimer = null; }
  closeModal();
  cerrarSesionSence(attId, true);
}

/* Profesor: iniciar / cerrar el bloque */
async function iniciarBloqueProfesor(classId) {
  const btn = document.getElementById('btnIniciarBloque'); if (btn) btn.disabled = true;
  try {

async function cerrarBloqueProfesor(classId) {

async function renderMalla(mc) {

    _malla.mallas = new Map(ms.docs.map(d => [d.id, d.data()]));
    _malla.cursos = new Map();
    _malla.clases.forEach(c => { const id = c.cursoId || slugCurso(c.courseName); if (id && !_malla.cursos.has(id)) _malla.cursos.set(id, c.courseName); });
    _malla.mallas.forEach((m, id) => { if (!_malla.cursos.has(id)) _malla.cursos.set(id, m.courseName || id); });
    const sel = document.getElementById('ml_curso');
    if (!_malla.cursos.size) { document.getElementById('ml_body').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Aún no hay cursos. Importa clases o crea un curso nuevo.</p></div>'; return; }

function nuevoCursoMalla() {
  const n = (prompt('Nombre del curso (igual que el "Nombre del curso" al importar):') || '').trim();
  if (!n) return;
  const id = slugCurso(n); if (!id) return toast('⚠️ Nombre inválido.', 'warning');
  _malla.cursos.set(id, n);
  const sel = document.getElementById('ml_curso');
  sel.innerHTML = [..._malla.cursos].map(([i, nm]) => `<option value="${escHtml(i)}">${escHtml(nm)}</option>`).join('');
  sel.value = id; cargarMallaCurso(id);
}
function cargarMallaCurso(cursoId) {
  _malla.cursoId = cursoId; _malla.courseName = _malla.cursos.get(cursoId) || cursoId;
  const m = _malla.mallas.get(cursoId);
  _malla.asig = (m?.asignaturas || []).map(a => ({ ...a }));
  pintarMalla();
}
function _horasAsig() {
  // horas agendadas y dictadas (bloques cerrados) por asignatura, a partir de los tramos de los bloques del curso
  const ag = {}, di = {};
  _malla.clases.filter(c => (c.cursoId || slugCurso(c.courseName)) === _malla.cursoId).forEach(c => {
    (c.segmentos || []).forEach(g => {
      const k = normTxt(g.titulo);
      ag[k] = (ag[k] || 0) + (g.durMin || 0);
      if (c.status === 'finished') di[k] = (di[k] || 0) + (g.durMin || 0);
    });
  });
  return { ag, di };
}
function pintarMalla() {
  const { ag, di } = _horasAsig();
  const h = m => Math.round((m || 0) / 6) / 10;
  const body = document.getElementById('ml_body');
  const filas = _malla.asig.map((a, i) => {
    const k = normTxt(a.nombre), prog = Number(a.horas) || 0, agh = h(ag[k]), dih = h(di[k]);
    const est = !prog ? '' : agh < prog ? `<span class="badge badge-orange">faltan ${Math.round((prog - agh) * 10) / 10} h por agendar</span>` : agh > prog ? `<span class="badge badge-red">excede en ${Math.round((agh - prog) * 10) / 10} h</span>` : '<span class="badge badge-green">completa</span>';
    return `<tr>
      <td><input type="text" value="${escHtml(a.nombre)}" oninput="_malla.asig[${i}].nombre=this.value" style="min-width:220px"></td>
      <td><input type="number" min="0" step="0.5" value="${a.horas ?? ''}" oninput="_malla.asig[${i}].horas=parseFloat(this.value)||0" style="width:80px"></td>
      <td><select onchange="_malla.asig[${i}].profesorUid=this.value;_malla.asig[${i}].profesorNombre=this.selectedOptions[0].dataset.n||''">
        <option value="">— sin titular —</option>${_malla.profs.map(p => `<option value="${p.uid}" data-n="${escHtml(p.name)}" ${a.profesorUid === p.uid ? 'selected' : ''}>${escHtml(p.name)}</option>`).join('')}</select></td>
      <td><input type="text" value="${escHtml(a.codModulo || '')}" oninput="_malla.asig[${i}].codModulo=this.value" style="width:130px" placeholder="solo línea 1"></td>
      <td style="font-size:12.5px">${agh} h agendadas<br>${dih} h dictadas</td><td>${est}</td>
      <td><button class="btn btn-sm btn-danger" onclick="_malla.asig.splice(${i},1);pintarMalla()">🗑️</button></td></tr>`;
  }).join('');
  body.innerHTML = `<div class="card">
    <div class="card-header"><h3>📋 Ramos de ${escHtml(_malla.courseName)}</h3>
      <div class="flex gap-2 flex-wrap"><button class="btn btn-sm btn-secondary" onclick="copiarMallaDe()">📋 Copiar de otro curso</button>
      <button class="btn btn-sm btn-secondary" onclick="mallaDesdeBloques()">📥 Crear desde los bloques agendados</button>
      <button class="btn btn-sm btn-primary" onclick="_malla.asig.push({nombre:'',horas:0,profesorUid:'',profesorNombre:'',codModulo:''});pintarMalla()">➕ Agregar ramo</button></div></div>
    ${_malla.asig.length ? `<div class="table-wrap"><table><thead><tr><th>Asignatura</th><th>Horas</th><th>Profesor titular</th><th>Módulo SIC</th><th>Avance</th><th></th><th></th></tr></thead><tbody>${filas}</tbody></table></div>` : '<div class="empty-state"><p>La malla está vacía. Agrega ramos o créala desde los bloques ya agendados.</p></div>'}
    <div style="margin-top:14px"><button class="btn btn-success" onclick="guardarMalla()">💾 Guardar malla</button></div></div>`;
}
function copiarMallaDe() {
  const otros = [..._malla.mallas].filter(([id, m]) => id !== _malla.cursoId && (m.asignaturas || []).length);
  if (!otros.length) return toast('Aún no hay otras mallas guardadas para copiar.', 'info');
  openModal(`<h3>📋 Copiar malla de otro curso</h3>
    <p style="font-size:13px;color:var(--text-mid)">Copia los ramos, horas, titulares y módulos. Después puedes ajustar lo que cambie. No se pisan los ramos que ya tengas.</p>
    <div class="form-group"><label>Copiar desde</label><select id="ml_copia">${otros.map(([id, m]) => `<option value="${escHtml(id)}">${escHtml(m.courseName || id)} (${m.asignaturas.length} ramos)</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="aplicarCopiaMalla()">Copiar</button></div>`);
}
function aplicarCopiaMalla() {
  const m = _malla.mallas.get(document.getElementById('ml_copia').value); closeModal(); if (!m) return;
  const ya = new Set(_malla.asig.map(a => normTxt(a.nombre)));
  m.asignaturas.forEach(a => { if (!ya.has(normTxt(a.nombre))) _malla.asig.push({ ...a }); });
  pintarMalla(); toast('✅ Malla copiada. Revisa y guarda.', 'success');
}
function mallaDesdeBloques() {
  const mapa = new Map();
  _malla.clases.filter(c => (c.cursoId || slugCurso(c.courseName)) === _malla.cursoId).forEach(c => (c.segmentos || []).forEach(g => {
    const k = normTxt(g.titulo); if (!mapa.has(k)) mapa.set(k, { nombre: g.titulo, min: 0, profs: {}, codModulo: g.codModulo || '' });
    const x = mapa.get(k); x.min += g.durMin || 0; if (g.profesorUid) x.profs[g.profesorUid] = (x.profs[g.profesorUid] || 0) + 1;
  }));
  if (!mapa.size) return toast('No hay bloques con tramos en este curso.', 'info');
  const ya = new Set(_malla.asig.map(a => normTxt(a.nombre)));
  mapa.forEach((x, k) => {
    if (ya.has(k)) return;
    const top = Object.entries(x.profs).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    _malla.asig.push({ nombre: x.nombre, horas: Math.round(x.min / 6) / 10, profesorUid: top, profesorNombre: _malla.profs.find(p => p.uid === top)?.name || '', codModulo: x.codModulo });
  });
  pintarMalla(); toast('✅ Malla armada con lo agendado. Revisa las horas y los titulares, y guarda.', 'success', 6000);
}
async function guardarMalla() {
  const asig = _malla.asig.map(a => ({ nombre: String(a.nombre || '').trim(), horas: Number(a.horas) || 0, profesorUid: a.profesorUid || '', profesorNombre: a.profesorNombre || '', codModulo: String(a.codModulo || '').trim() }));
  if (asig.some(a => a.nombre.length < 3)) return toast('⚠️ Todos los ramos deben tener nombre.', 'warning');
  const nombres = asig.map(a => normTxt(a.nombre));
  if (new Set(nombres).size !== nombres.length) return toast('⚠️ Hay ramos repetidos.', 'warning');
  try {
    await db.collection('mallas').doc(_malla.cursoId).set({ cursoId: _malla.cursoId, courseName: _malla.courseName, asignaturas: asig, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    _malla.mallas.set(_malla.cursoId, { cursoId: _malla.cursoId, courseName: _malla.courseName, asignaturas: asig });
    toast('✅ Malla guardada.', 'success'); pintarMalla();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

    <div id="mat_body"><div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div></div>`;
  try {
    const [cs, as] = await Promise.all([
      db.collection('liveClasses').get(),
      db.collection('users').where('role', '==', 'student').orderBy('name').get()
    ]);
    _mat.cursos = new Map();
    cs.docs.forEach(d => {
      const c = d.data(); const id = c.cursoId || slugCurso(c.courseName);
      if (!id) return;
      if (!_mat.cursos.has(id)) _mat.cursos.set(id, { name: c.courseName, legacy: !c.cursoId, n: 0 });
      _mat.cursos.get(id).n++;
    });
    _mat.alumnos = as.docs.map(d => ({ uid: d.id, name: d.data().name || '', rut: d.data().rut || '' }));
    const sel = document.getElementById('mat_curso');
    if (!_mat.cursos.size) {
      document.getElementById('mat_body').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Aún no hay cursos. Crea o importa clases primero (el curso se toma del nombre).</p></div>';
      return;
    }
    sel.innerHTML = [..._mat.cursos.entries()].map(([id, c]) => `<option value="${id}">${escHtml(c.name)} (${c.n} clases)</option>`).join('');
    cargarMatriculasCurso(sel.value);
  } catch (e) {
    document.getElementById('mat_body').innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>${escHtml(e.message)}</p></div>`;
  }
}

async function cargarMatriculasCurso(cursoId) {

      ${_mat.matriculados.length ? `<div class="table-wrap"><table><thead><tr><th>Alumno</th><th>RUT</th><th></th></tr></thead><tbody>
        ${_mat.matriculados.map(m => `<tr><td>${escHtml(m.nombre)}</td><td style="font-family:'DM Mono'">${escHtml(m.rut)}</td>

      </tbody></table></div>` : '<div class="empty-state"><p>Nadie matriculado todavía.</p></div>'}
    </div>
    <div class="card">
      <div class="card-header"><h3>➕ Matricular</h3>
        <button class="btn btn-sm btn-primary" onclick="matricularTodos()">Matricular a TODOS los alumnos (${libres.length})</button></div>
      <div class="form-group"><label>Buscar y marcar alumnos</label>
        <input type="text" id="mat_buscar" placeholder="Nombre o RUT..." oninput="filtrarLibresMat()"></div>
      <div id="mat_libres" style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:8px">
        ${libres.map(a => `<label class="mat-row" data-t="${escHtml(normTxt(a.name + ' ' + a.rut))}" style="display:flex;gap:8px;padding:4px 2px;cursor:pointer">
          <input type="checkbox" value="${a.uid}"> <span>${escHtml(a.name)} <small style="font-family:'DM Mono';color:var(--text-light)">${escHtml(a.rut)}</small></span></label>`).join('') || '<em>No quedan alumnos por matricular.</em>'}
      </div>
      <div style="margin-top:10px"><button class="btn btn-success" onclick="matricularMarcados()">✅ Matricular marcados</button></div>
      <hr style="margin:18px 0;border:none;border-top:1px solid var(--border)">
      <div class="form-group"><label>O pega RUTs (uno por línea)</label>
        <textarea id="mat_ruts" rows="4" placeholder="12345678-9&#10;11111111-1"></textarea></div>
      <button class="btn btn-secondary" onclick="matricularPorRut()">Matricular por RUT</button>
    </div>`;
}
function filtrarLibresMat() {
  const q = normTxt(document.getElementById('mat_buscar').value);
  document.querySelectorAll('#mat_libres .mat-row').forEach(el => { el.style.display = el.dataset.t.includes(q) ? 'flex' : 'none'; });
}
async function _matricular(alumnos) {
  if (!alumnos.length) return toast('⚠️ No hay alumnos para matricular.', 'warning');
  const cinfo = _mat.cursos.get(_mat.cursoId);
  for (let i = 0; i < alumnos.length; i += 400) {
    const batch = db.batch();
    alumnos.slice(i, i + 400).forEach(a => batch.set(db.collection('matriculas').doc(`${a.uid}__${_mat.cursoId}`), {
      userId: a.uid, rut: a.rut, nombre: a.name, cursoId: _mat.cursoId, courseName: cinfo?.name || '',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }));
    await batch.commit();
  }
  toast(`✅ ${alumnos.length} alumno(s) matriculado(s).`, 'success');
  cargarMatriculasCurso(_mat.cursoId);
}
function matricularMarcados() {
  const ids = [...document.querySelectorAll('#mat_libres input:checked')].map(i => i.value);
  _matricular(_mat.alumnos.filter(a => ids.includes(a.uid))).catch(e => toast('❌ ' + e.message, 'error'));
}
function matricularTodos() {
  const ya = new Set(_mat.matriculados.map(m => m.userId));
  const libres = _mat.alumnos.filter(a => !ya.has(a.uid));
  if (!libres.length) return toast('Ya están todos matriculados.', 'info');
  if (!confirm(`¿Matricular a ${libres.length} alumnos en este curso?`)) return;
  _matricular(libres).catch(e => toast('❌ ' + e.message, 'error'));
}
function _normRutTxt(s) {
  let r = String(s || '').replace(/[.\s]/g, '').toUpperCase();
  if (r && !r.includes('-') && r.length > 1) r = r.slice(0, -1) + '-' + r.slice(-1);
  return r;
}
function matricularPorRut() {
  const lineas = document.getElementById('mat_ruts').value.split(/\n+/).map(_normRutTxt).filter(Boolean);
  const porRut = new Map(_mat.alumnos.map(a => [_normRutTxt(a.rut), a]));
  const hallados = [], noHallados = [];
  lineas.forEach(r => (porRut.has(r) ? hallados.push(porRut.get(r)) : noHallados.push(r)));
  if (noHallados.length) toast('⚠️ RUT sin alumno registrado: ' + noHallados.join(', '), 'warning', 9000);
  _matricular(hallados).catch(e => toast('❌ ' + e.message, 'error'));
}
async function quitarMatricula(id) {
  if (!confirm('¿Quitar esta matrícula? El alumno dejará de ver el curso (su asistencia ya registrada se conserva).')) return;
  try { await db.collection('matriculas').doc(id).delete(); cargarMatriculasCurso(_mat.cursoId); }
  catch (e) { toast('❌ ' + e.message, 'error'); }
}

      <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>

      <button class="btn btn-primary" onclick="generarInformeCurso('xlsx')">📥 Excel</button>
    </div>`);

/* Ventana OFICIAL del bloque = desde que el profesor lo inició hasta que lo cerró.
   El tiempo válido del alumno es la intersección entre su sesión SENCE y esa ventana
   (si el alumno marcó antes de que el profesor iniciara, cuenta desde el inicio oficial). */
function ventanaClase(c) {
  const ini = c.scheduledAt.toDate();
  const fin = new Date(ini.getTime() + (c.duration || 0) * 60000);
  const oficial = !!c.bloqueIniciadoAt;
  return { w0: c.bloqueIniciadoAt?.toDate?.() || ini, w1: c.bloqueCerradoAt?.toDate?.() || fin, oficial };
}
function intervaloValido(a, c) {
  const s = a.inicioSesion?.toDate?.(); if (!s) return null;
  const { w0, w1, oficial } = ventanaClase(c);
  let e = a.cierreSesion?.toDate?.();
  const sinCierre = !e;
  if (!e) { if (!oficial || !c.bloqueCerradoAt) return { s, e: null, sinCierre, min: null }; e = w1; }
  if (!oficial) return { s, e, sinCierre, min: Math.min(Math.max(0, Math.round((e - s) / 60000)), c.duration || 1e9) };
  const S = new Date(Math.max(s, w0)), E = new Date(Math.min(e, w1));
  return { s: S, e: E, sinCierre, min: Math.max(0, Math.round((E - S) / 60000)) };
}
function minutosEnTramo(iv, c, sg) {
  if (!iv || !iv.e) return 0;
  const d = c.scheduledAt.toDate();
  const tD = t => { const [h, m] = String(t).split(':').map(Number); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m); };
  const S = Math.max(iv.s, tD(sg.ini)), E = Math.min(iv.e, tD(sg.fin));
  return Math.max(0, Math.round((E - S) / 60000));
}

async function generarInformeCurso(formato) {
  const cursoId = document.getElementById('inf_curso').value;
  toast('⏳ Generando informe...', 'info', 2500);
  try {
    const cs = await db.collection('liveClasses').get();
    const clases = cs.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(c => (c.cursoId || slugCurso(c.courseName)) === cursoId)
      .sort((a, b) => (a.scheduledAt?.toMillis?.() || 0) - (b.scheduledAt?.toMillis?.() || 0));
    if (!clases.length) return toast('Sin clases.', 'warning');
    const ids = clases.map(c => c.id);
    let regs = [];
    for (let i = 0; i < ids.length; i += 30) {
      const s = await db.collection('senceAttendance').where('classId', 'in', ids.slice(i, i + 30)).get();
      regs = regs.concat(s.docs.map(d => ({ id: d.id, ...d.data() })));
    }
    const ms = await db.collection('matriculas').where('cursoId', '==', cursoId).get();
    const alumnos = new Map();
    ms.docs.forEach(d => { const m = d.data(); alumnos.set(m.userId, { rut: m.rut, nombre: m.nombre }); });
    regs.forEach(a => { if (!alumnos.has(a.userId)) alumnos.set(a.userId, { rut: a.runAlumno || '', nombre: a.userName || '' }); });

    const claseById = new Map(clases.map(c => [c.id, c]));
    const ivDe = a => { const c = claseById.get(a.classId); return c ? intervaloValido(a, c) : null; };
    const totalProg = clases.reduce((s, c) => s + (c.segmentos?.length ? c.segmentos.reduce((x, g) => x + (g.durMin || 0), 0) : (c.duration || 0)), 0);
    const asigCols = []; // asignaturas únicas en orden de aparición
    clases.forEach(c => (c.segmentos?.length ? c.segmentos.map(g => g.titulo) : [c.title]).forEach(t => { if (!asigCols.includes(t)) asigCols.push(t); }));

    const filas = [...alumnos.entries()].map(([uid, al]) => {
      const mias = regs.filter(r => r.userId === uid);
      let tot = 0, asist = 0, sinCierre = 0;
      const porAsig = Object.fromEntries(asigCols.map(t => [t, 0]));
      const celdas = clases.map(c => {
        const rs = mias.filter(r => r.classId === c.id && r.inicioSesion);
        if (!rs.length) return 'Ausente';
        const ivs = rs.map(r => intervaloValido(r, c));
        sinCierre += ivs.filter(x => x && x.sinCierre).length;
        if (ivs.every(x => !x || x.min === null)) return 'Sin cierre';
        const tope = c.segmentos?.length ? c.segmentos.reduce((x, g) => x + (g.durMin || 0), 0) : (c.duration || 1e9);
        let m = Math.min(ivs.reduce((s, x) => s + (x && x.min || 0), 0), tope);
        // minutos por asignatura (tramo)
        if (c.segmentos?.length) { m = 0; c.segmentos.forEach(g => { const mm = ivs.reduce((s, x) => s + minutosEnTramo(x, c, g), 0); porAsig[g.titulo] += mm; m += mm; }); }
        else porAsig[c.title] += m;
        tot += m; asist++; return m;
      });
      return { ...al, asist, tot, sinCierre, pct: totalProg ? Math.round(tot / totalProg * 1000) / 10 : 0, celdas, porAsig };
    }).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));

    const cab = clases[0], nombreCurso = cab.courseName || cursoId;
    const fmtC = c => `${fmtDate(c.scheduledAt)} ${c.scheduledAt.toDate().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })} ${c.title}`;
    const hh = m => Math.round(m / 6) / 10;

    if (formato === 'xlsx') {
      const resumen = [
        ['Informe de asistencia — ' + nombreCurso], ['Línea', cab.lineaCapacitacion, 'CodSence', cab.codSence || '', 'CodigoCurso', cab.codigoCurso || ''],
        ['Generado', new Date().toLocaleString('es-CL'), 'Horas programadas', hh(totalProg)],
        ['Horas válidas = tiempo de la sesión SENCE del alumno dentro de la ventana oficial del bloque (inicio/cierre del profesor).'], [],
        ['Alumno', 'RUT', 'Bloques asistidos', 'Horas asistidas', '% asistencia', 'Sesiones sin cierre SENCE', ...clases.map(fmtC)]
      ];
      filas.forEach(f => resumen.push([f.nombre, f.rut, `${f.asist}/${clases.length}`, hh(f.tot), f.pct, f.sinCierre, ...f.celdas]));
      const porAsigSheet = [['Alumno', 'RUT', ...asigCols, 'Total horas']];
      filas.forEach(f => porAsigSheet.push([f.nombre, f.rut, ...asigCols.map(t => hh(f.porAsig[t])), hh(f.tot)]));
      const detalle = [['RUT', 'Alumno', 'Bloque', 'Fecha', 'Inicio SENCE', 'Cierre SENCE', 'Minutos válidos', 'Cierre SENCE pendiente', 'Bloque inició (profesor)', 'Bloque cerró (profesor)', 'ID sesión SENCE', 'Estado']];
      regs.sort((a, b) => (a.runAlumno || '').localeCompare(b.runAlumno || '')).forEach(a => {
        const c = claseById.get(a.classId); const iv = ivDe(a);
        detalle.push([a.runAlumno || '', a.userName || '', a.classTitle || '', c ? fmtDate(c.scheduledAt) : '',
          a.inicioSesion ? fmtDateTime(a.inicioSesion) : '', a.cierreSesion ? fmtDateTime(a.cierreSesion) : '', iv?.min ?? '',
          a.inicioSesion && !a.cierreSesion ? 'Sí' : 'No', c?.bloqueIniciadoAt ? fmtDateTime(c.bloqueIniciadoAt) : '', c?.bloqueCerradoAt ? fmtDateTime(c.bloqueCerradoAt) : '',
          a.idSesionSence || '', a.estadoSesion || '']);
      });
      const wb = XLSX.utils.book_new();
      const w1 = XLSX.utils.aoa_to_sheet(resumen); w1['!cols'] = [{ wch: 34 }, { wch: 13 }, { wch: 16 }, { wch: 15 }, { wch: 13 }, { wch: 22 }, ...clases.map(() => ({ wch: 28 }))];
      XLSX.utils.book_append_sheet(wb, w1, 'Resumen');
      const w3 = XLSX.utils.aoa_to_sheet(porAsigSheet); w3['!cols'] = [{ wch: 34 }, { wch: 13 }, ...asigCols.map(() => ({ wch: 24 })), { wch: 12 }];
      XLSX.utils.book_append_sheet(wb, w3, 'Horas por asignatura');
      const w2 = XLSX.utils.aoa_to_sheet(detalle); w2['!cols'] = [{ wch: 13 }, { wch: 32 }, { wch: 44 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 18 }, { wch: 18 }, { wch: 40 }, { wch: 12 }];
      XLSX.utils.book_append_sheet(wb, w2, 'Detalle');
      XLSX.writeFile(wb, `asistencia_${cursoId}_${new Date().toISOString().slice(0, 10)}.xlsx`);
    } else {
      const { jsPDF } = window.jspdf; const doc = new jsPDF();
      let y = 18;
      const head = () => { doc.setFontSize(13); doc.text('Informe de asistencia — ' + nombreCurso.slice(0, 60), 14, 14); doc.setFontSize(9);
        doc.text(`Generado ${new Date().toLocaleString('es-CL')} · Horas programadas: ${hh(totalProg)} · Bloques: ${clases.length}`, 14, 20);
        doc.setFont(undefined, 'bold'); doc.text('Alumno', 14, 28); doc.text('RUT', 95, 28); doc.text('Bloques', 128, 28); doc.text('Horas', 152, 28); doc.text('%', 172, 28); doc.text('Sin cierre', 183, 28); doc.setFont(undefined, 'normal'); y = 34; };
      head();
      filas.forEach(f => { if (y > 280) { doc.addPage(); head(); }
        doc.text(String(f.nombre).slice(0, 46), 14, y); doc.text(String(f.rut), 95, y); doc.text(`${f.asist}/${clases.length}`, 128, y); doc.text(String(hh(f.tot)), 152, y); doc.text(f.pct + '%', 172, y); doc.text(String(f.sinCierre), 188, y); y += 6; });
      doc.save(`asistencia_${cursoId}_${new Date().toISOString().slice(0, 10)}.pdf`);
    }
    closeModal(); toast('✅ Informe generado.', 'success');
  } catch (e) { toast('❌ ' + e.message, 'error', 8000); }
}

function bannerSesionesLargas(docs) {
  const ahora = Date.now();
  const largas = docs.filter(d => {
    const a = d.data(); const ini = a.inicioSesion?.toMillis?.(); const ls = a.lastSeen?.toMillis?.();
    return a.estadoSesion === 'abierta' && (a.bloqueCerrado === true || (ini && ahora - ini > 9 * 3600e3) || (ls && ahora - ls > 30 * 60e3));
  });
  if (!largas.length) return '';
  return `<div class="card" style="border:2px solid var(--warning);background:#fff8ee">
    <strong>⚠️ ${largas.length} sesión(es) SENCE sin cerrar (bloque terminado, mucho tiempo abierta o sin actividad)</strong>
    <div style="font-size:13px;margin:6px 0">${largas.slice(0, 6).map(d => escHtml(d.data().userName || d.data().runAlumno || '')).join(', ')}${largas.length > 6 ? '…' : ''}</div>
    <button class="btn btn-sm btn-warning" onclick="navigate('attendance')">Revisar y cerrar</button></div>`;
}

function showProfesoresMasivo() {
  openModal(`
    <h3>📋 Carga masiva de profesores</h3>
    <p style="font-size:13px;color:var(--text-mid)">Una línea por profesor: <code>RUT;Nombre completo</code> (o pegado desde Excel con tabulación). Contraseña inicial: últimos 6 dígitos del RUT.</p>
    <textarea id="pm_texto" rows="8" style="width:100%" placeholder="12345678-9;Mariela Andrea Arancibia Cortez"></textarea>
    <div id="pm_estado" style="font-size:13px;margin-top:8px"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" id="pm_btn" onclick="crearProfesoresMasivo()">✅ Crear</button>
    </div>`, true);
}
async function crearProfesoresMasivo() {
  const lineas = document.getElementById('pm_texto').value.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const items = [], malos = [];
  lineas.forEach(l => {
    const partes = l.split(/[;\t,]/).map(p => p.trim()).filter(Boolean);
    const rutP = partes.find(p => /^[\d.]+-?[\dkK]$/.test(p.replace(/\s/g, '')));
    const nom = partes.find(p => p !== rutP);
    const rut = rutP ? _normRutTxt(rutP) : '';
    if (rut && nom && validarRut(rut)) items.push({ rut, nombre: nom }); else malos.push(l);
  });
  if (!items.length) return toast('⚠️ No hay líneas válidas.', 'warning');
  const btn = document.getElementById('pm_btn'), est = document.getElementById('pm_estado'); btn.disabled = true;
  let ok = 0, ya = 0, err = 0;
  for (const it of items) {
    est.textContent = `Procesando ${ok + ya + err + 1}/${items.length}: ${it.nombre}...`;
    try {
      if (await crearCuenta(it.nombre, it.rut, 'teacher') === 'existe') { ya++; continue; }
      ok++;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') { err++; est.innerHTML += `<br>⚠️ ${escHtml(it.rut)}: cuenta antigua huérfana — créalo individualmente para repararla.`; }
      else { err++; console.warn(it.nombre, e.message); }
    }
  }
  est.innerHTML = `<strong>Listo:</strong> ${ok} creados · ${ya} ya existían · ${err} con error${malos.length ? ' · ' + malos.length + ' líneas inválidas' : ''}`;
  btn.disabled = false; cargarListaProfesores();
}

function a11yZoom(delta) {
  let z = 1; try { z = parseFloat(localStorage.getItem('a11yZoom')) || 1; } catch (e) {}
  z = delta === 0 ? 1 : Math.min(1.5, Math.max(0.9, Math.round((z + delta) * 100) / 100));
  try { localStorage.setItem('a11yZoom', z); } catch (e) {}
  a11yAplicar();
}
function a11yContraste() {
  let hc = false; try { hc = localStorage.getItem('a11yHC') === '1'; } catch (e) {}
  try { localStorage.setItem('a11yHC', hc ? '0' : '1'); } catch (e) {}
  a11yAplicar();
}
document.addEventListener('DOMContentLoaded', a11yAplicar);

/* ════════════════════════════════════════════════
   VISTA: SALA DEL PROFESOR (Teacher Room)
   ─────────────────────────────────────────────
   Al entrar: registra su presencia y activa clase.
   Muestra alumnos en tiempo real + tiempo docencia.
   Al salir: registra salida.
════════════════════════════════════════════════ */
let _teacherSessionDocId = null;
let _teacherClassTimer   = null;
let _teacherRTListener   = null;
let _teacherClassStart   = null;

async function renderTeacherRoom(mc, params={}) {
  const classId = params.id;
  if (!classId) { mc.innerHTML='<div class="empty-state"><div class="icon">❌</div><p>Clase no encontrada.</p></div>'; return; }

  const doc = await db.collection('liveClasses').doc(classId).get();
  if (!doc.exists) { mc.innerHTML='<div class="empty-state"><div class="icon">❌</div><p>Clase no encontrada.</p></div>'; return; }
  const cls = doc.data();
  if (!puedeVerClase(cls)) {
    mc.innerHTML='<div class="empty-state"><div class="icon">🔒</div><p>Este bloque no está asignado a ti (o no tiene profesor asignado). Pide a un administrador que lo asigne.</p></div>'; return;
  }

  const teacherName = currentUser.displayName || currentUser.email.split('@')[0];
  const duracionMin = cls.duration || 60;
  const duracionSeg = duracionMin * 60;

  // Construir embed del video
  let videoEmbed = '';
  const _esJitsi = cls.videoType === 'jitsi' && cls.jitsiRoom;
  if (_esJitsi) {
    videoEmbed = `<div id="jitsiHost" class="jitsi-host"><div class="video-placeholder"><div class="icon">📡</div><p>Conectando a la sala...</p></div></div>`;
  } else if (cls.videoType === 'jitsi') {
    videoEmbed = `<div class="video-placeholder"><div class="icon">🔒</div><p>Esta clase no tiene una sala Jitsi válida configurada.</p></div>`;
  } else if (cls.videoUrl && urlEsJitsiPropia(cls.videoUrl)) {
    videoEmbed = `<div class="video-placeholder"><div class="icon">🔒</div><p>Esta clase apunta a una sala de INASEP por un enlace directo. Contacta a INASEP.</p></div>`;
  } else if (cls.videoUrl) {
    let embedUrl = cls.videoUrl;
    if (cls.videoType === 'youtube') {
      const ytMatch = cls.videoUrl.match(/(?:v=|youtu\.be\/)([^&?]+)/);
      if (ytMatch) embedUrl = `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=0`;
    }
    videoEmbed = `<iframe class="video-frame" src="${escHtml(embedUrl)}" allow="camera;microphone;fullscreen;display-capture;autoplay" allowfullscreen></iframe>`;
  } else {
    videoEmbed = `<div class="video-placeholder"><div class="icon">📡</div><p>El enlace de videoconferencia aún no está disponible.</p></div>`;
  }

  mc.innerHTML = `
    <div class="page-header">
      <div>
        <h2>👨‍🏫 ${escHtml(cls.title)}</h2>
        <div class="breadcrumb"><a onclick="salirseDeSala()">← Mis Clases</a> › Vista Profesor</div>
      </div>
      ${cls.status==='active' ? '<span class="badge badge-live">🔴 EN VIVO</span>' : ''}
    </div>

    <!-- ESTADO DEL BLOQUE -->
    <div class="card" id="bloqueEstadoCard" style="margin-bottom:16px;border:2px solid ${cls.status==='active'?'var(--success)':'var(--warning)'}">
      ${cls.status === 'active'
        ? `<strong>🔴 Bloque en curso</strong>${cls.bloqueIniciadoAt ? ' desde las ' + cls.bloqueIniciadoAt.toDate().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : ''}. Los alumnos pueden registrar su asistencia SENCE.`
        : cls.status === 'finished'
        ? `<strong>⏹ Bloque cerrado</strong>${cls.bloqueCerradoAt ? ' a las ' + cls.bloqueCerradoAt.toDate().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : ''}. Solo un administrador puede reabrirlo.`
        : `<strong>⏳ El bloque aún no inicia.</strong> Los alumnos no pueden registrarse en SENCE hasta que lo inicies.
           <div style="margin-top:10px"><button class="btn btn-success" id="btnIniciarBloque" onclick="iniciarBloqueProfesor('${classId}')">▶️ Iniciar bloque</button></div>`}
    </div>

    ${htmlTramos(cls)}

    <!-- CRONÓMETRO DOCENCIA -->
    <div class="session-timer" id="teacherTimerBox">
      <div>
        <div class="timer-label">⏱ Tiempo de Docencia</div>
        <div class="timer-display" id="teacherTimerDisplay">00:00:00</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px;">Tiempo que llevas en esta sesión</div>
      </div>
      <div style="text-align:right">
        <div class="timer-label">Duración Total</div>
        <div style="font-size:22px;font-family:'DM Mono';color:var(--green-100)">${duracionMin} min</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-top:4px" id="teacherTimeCoverage">Calculando...</div>
      </div>
    </div>

    <!-- ESTADO CLASE -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <h3>📊 Estado de la Clase en Tiempo Real</h3>
        <button class="btn btn-sm btn-secondary" onclick="recargarAlumnosRTDB('${classId}')">🔄 Actualizar</button>
      </div>
      <div id="teacherAlumnosRT">
        <div class="empty-state"><div class="icon">⏳</div><p>Cargando alumnos...</p></div>
      </div>
    </div>

    <!-- VIDEO -->
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">
      <div class="video-room">${videoEmbed}</div>
      ${_esJitsi ? `<div style="padding:10px 14px;border-top:1px solid var(--border,#e5e7eb);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn btn-sm btn-secondary" onclick="reingresarSala('${classId}')">🔄 Reingresar a la sala</button><span style="color:var(--text-mid)">Si te desconectaste o la sala no carga, reingresa aquí. Se revisa el estado del bloque.</span></div>` : ''}
    </div>

    <!-- COMUNICACIÓN SINCRÓNICA: chat en vivo -->
    <div class="chat-panel">
      <div class="chat-panel-header">💬 Chat de la clase (en vivo)</div>
      <div class="chat-messages" id="classChatMessages"><div class="empty-state" style="padding:20px"><p style="font-size:12.5px">Cargando chat...</p></div></div>
      <div class="chat-input-row">
        <input type="text" id="classChatInput" placeholder="Escribe un mensaje a tus alumnos..." onkeydown="if(event.key==='Enter')sendClassChat('${classId}')">
        <button class="btn btn-primary btn-sm" onclick="sendClassChat('${classId}')">Enviar</button>
      </div>
    </div>

    <!-- LIBRO DE CLASES: materia tratada y firma docente -->
    <div class="card" style="margin-bottom:24px">
      <div class="card-header"><h3>📖 Libro de Clases Electrónico</h3></div>
      <p style="font-size:12.5px;color:var(--text-mid);margin-bottom:10px">
        Registra la materia tratada en esta sesión y firma para dejar constancia en el Libro de Clases (obligatorio también en e-learning).
      </p>
      <div class="form-group">
        <label>Materia / contenidos tratados en esta clase *</label>
        <textarea id="fc_materiaTratada" rows="3" placeholder="Ej: Marco legal Ley N° 21.659, funciones del guardia OS10..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="firmarLibroClase('${classId}')">✍️ Firmar y Registrar en Libro de Clases</button>
      <div id="libroClaseEstado" style="margin-top:10px"></div>
    </div>

    <!-- SALIR / CERRAR BLOQUE -->
    <div class="card" style="margin-bottom:24px">
      <p style="font-size:12.5px;color:var(--text-mid);margin-bottom:10px">
        <strong>Relevo de profesor:</strong> usa "Salir de la sala"; el bloque sigue abierto y el siguiente profesor lo retoma en la misma sala.<br>
        <strong>Almuerzo o fin de jornada:</strong> usa "Cerrar bloque"; los alumnos recibirán el aviso para cerrar su sesión SENCE.</p>
      <div class="flex gap-2 flex-wrap">
        <button class="btn btn-secondary" onclick="salirseDeSala()">🚪 Salir de la sala (relevo)</button>
        ${cls.status === 'active' ? `<button class="btn btn-danger" onclick="cerrarBloqueProfesor('${classId}')">⏹ Cerrar bloque (almuerzo / fin de jornada)</button>` : ''}
      </div>
    </div>`;

  initClassChat(classId);
  if (cls.videoType === 'jitsi' && cls.jitsiRoom) montarVideoJitsi('jitsiHost', classId, cls);
  cargarEstadoLibroClase(classId);

  // 1. Registrar entrada del profesor en teacherSessions
  await registrarEntradaProfesor(classId, cls, teacherName);

  // 2. Marcar clase como con profesor activo
  _teacherClassId = classId;
  if (cls.status !== 'finished') await db.collection('liveClasses').doc(classId).update({
    teacherActive: true,
    teacherUid: currentUser.uid,
    teacherName: teacherName,
    teacherEnteredAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  // 3. Iniciar cronómetro local
  _teacherClassStart = Date.now();
  _teacherClassTimer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - _teacherClassStart) / 1000);
    const hh = String(Math.floor(elapsed/3600)).padStart(2,'0');
    const mm = String(Math.floor((elapsed%3600)/60)).padStart(2,'0');
    const ss = String(elapsed%60).padStart(2,'0');
    const el = document.getElementById('teacherTimerDisplay');
    if (el) el.textContent = `${hh}:${mm}:${ss}`;
    const cov = document.getElementById('teacherTimeCoverage');
    if (cov) {
      const pct = Math.min(100, Math.round((elapsed/duracionSeg)*100));
      cov.textContent = `${pct}% del tiempo cubierto`;
      cov.style.color = pct >= 100 ? '#27ae60' : 'rgba(255,255,255,0.45)';
    }
  }, 1000);

  // 4. Escuchar alumnos en tiempo real
  cargarAlumnosEnVivoProfesor(classId);
}

async function registrarEntradaProfesor(classId, cls, teacherName) {
  try {
    const sesRef = await db.collection('teacherSessions').add({
      classId,
      classTitle: cls.title,
      teacherUid:  currentUser.uid,
      teacherName: teacherName,
      entradaAt:   firebase.firestore.FieldValue.serverTimestamp(),
      salidaAt:    null,
      duracionSeg: null,
      createdAt:   firebase.firestore.FieldValue.serverTimestamp()
    });
    _teacherSessionDocId = sesRef.id;
    toast(`✅ Entrada registrada. ¡Bienvenido, ${teacherName}!`, 'success', 4000);
  } catch(e) {
    toast('⚠️ No se pudo registrar entrada: ' + e.message, 'warning');
  }
}

async function salirseDeSala() {
  // Detener cronómetro
  if (_teacherClassTimer) { clearInterval(_teacherClassTimer); _teacherClassTimer = null; }
  if (_teacherRTListener) { _teacherRTListener(); _teacherRTListener = null; }

  // Registrar salida
  if (_teacherSessionDocId) {
    const duracionSeg = _teacherClassStart ? Math.floor((Date.now() - _teacherClassStart)/1000) : 0;
    try {
      await db.collection('teacherSessions').doc(_teacherSessionDocId).update({
        salidaAt:    firebase.firestore.FieldValue.serverTimestamp(),
        duracionSeg: duracionSeg
      });
    } catch(e) { console.warn('Error registrando salida:', e); }
    _teacherSessionDocId = null;
    _teacherClassStart   = null;
  }

  // Marcar clase sin profesor activo (solo si sigue siendo el mismo)
  // (No actualizamos status para no afectar el flujo de alumnos)
  try {
    if (_teacherClassId) {
      await db.collection('liveClasses').doc(_teacherClassId).update({ teacherActive: false, teacherLeftAt: firebase.firestore.FieldValue.serverTimestamp(), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
  } catch(e) { /* silencioso (p. ej. el bloque ya fue cerrado por el servidor) */ }
  _teacherClassId = null;

  toast('🚪 Salida registrada.', 'info');
  navigate('live-classes');
}

function cargarAlumnosEnVivoProfesor(classId) {
  const cont = document.getElementById('teacherAlumnosRT');
  if (!cont) return;

  // Suscripción en tiempo real
  if (_teacherRTListener) _teacherRTListener();
  _teacherRTListener = db.collection('senceAttendance')
    .where('classId','==',classId)
    .onSnapshot(snap => {
      const cont2 = document.getElementById('teacherAlumnosRT');
      if (!cont2) { if(_teacherRTListener){_teacherRTListener();_teacherRTListener=null;} return; }

      if (snap.empty) {
        cont2.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Ningún alumno ha iniciado sesión SENCE aún.</p></div>';
        return;
      }

      const abiertos = snap.docs.filter(d => d.data().sessionOpen === true).length;
      cont2.innerHTML = `
        <div style="margin-bottom:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--text-mid)">Total registros: <strong>${snap.size}</strong></span>
          <span class="badge badge-green">🟢 Sesiones abiertas: ${abiertos}</span>
          <span class="badge badge-gray">🔴 Cerradas: ${snap.size - abiertos}</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Alumno</th><th>RUN</th><th>Estado SENCE</th><th>Inicio Sesión</th><th>Última actividad</th></tr></thead>
            <tbody>
              ${snap.docs.map(d => {
                const a = d.data();
                const open = a.sessionOpen === true;
                return `<tr class="participant-row">
                  <td><div style="display:flex;align-items:center;gap:8px">
                    <div class="participant-avatar">${(a.userName||'?').slice(0,2).toUpperCase()}</div>
                    <span>${escHtml(a.userName||a.userEmail||'—')}</span>
                  </div></td>
                  <td><span style="font-family:'DM Mono';font-size:12px">${escHtml(a.runAlumno||'—')}</span></td>
                  <td><span class="badge ${open?'badge-green':'badge-gray'}">${open?'✅ Abierta':'⛔ Cerrada'}</span></td>
                  <td style="font-size:12px">${fmtDateTime(a.inicioSesion)}</td>
                  <td style="font-size:12px">${a.lastSeen ? fmtDateTime(a.lastSeen) : '—'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }, err => {
      const cont2 = document.getElementById('teacherAlumnosRT');
      if (cont2) cont2.innerHTML = `<p style="color:var(--danger);padding:12px">${err.message}</p>`;
    });
}

function recargarAlumnosRTDB(classId) {
  if (_teacherRTListener) { _teacherRTListener(); _teacherRTListener = null; }
  cargarAlumnosEnVivoProfesor(classId);
}

/* ════════════════════════════════════════════════
   VISTA: MI ASISTENCIA COMO PROFESOR (Teacher)
   Muestra historial de sesiones del profesor + 
   alumnos conectados en sus clases.
════════════════════════════════════════════════ */
async function renderTeacherAttendance(mc) {
  mc.innerHTML = `
    <div class="page-header">
      <div><h2>👥 Asistencia — Mis Clases</h2>
      <div class="breadcrumb">Registro de docencia y alumnos conectados</div></div>
    </div>

    <div class="card">
      <div class="card-header"><h3>🕐 Mi Historial de Docencia</h3></div>
      <div id="teacherHistorial"><div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div></div>
    </div>

    <div class="card">
      <div class="card-header"><h3>👨‍🎓 Alumnos en mis Clases</h3></div>
      <div id="teacherAlumnosHist"><div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div></div>
    </div>`;

  // Mis sesiones de docencia
  try {
    const snap = await db.collection('teacherSessions')
      .where('teacherUid','==',currentUser.uid)
      .orderBy('createdAt','desc').limit(50).get();

    const cont = document.getElementById('teacherHistorial');
    if (!cont) return;

    if (snap.empty) {
      cont.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Aún no has entrado a ninguna clase.</p></div>';
    } else {
      let totalSeg = 0;
      snap.docs.forEach(d => { totalSeg += d.data().duracionSeg || 0; });
      const hh = String(Math.floor(totalSeg/3600)).padStart(2,'0');
      const mm = String(Math.floor((totalSeg%3600)/60)).padStart(2,'0');

      cont.innerHTML = `
        <div style="margin-bottom:12px;font-size:13px;color:var(--text-mid)">
          Total docencia acumulada: <strong style="color:var(--primary)">${hh}h ${mm}m</strong>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Clase</th><th>Entrada</th><th>Salida</th><th>Duración</th></tr></thead>
            <tbody>
              ${snap.docs.map(d => {
                const s = d.data();
                const dur = s.duracionSeg ? `${Math.floor(s.duracionSeg/60)}m ${s.duracionSeg%60}s` : '(en curso)';
                return `<tr>
                  <td>${escHtml(s.classTitle||'—')}</td>
                  <td style="font-size:12px">${fmtDateTime(s.entradaAt)}</td>
                  <td style="font-size:12px">${s.salidaAt ? fmtDateTime(s.salidaAt) : '<span class="badge badge-live">Activa</span>'}</td>
                  <td><strong>${dur}</strong></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }
  } catch(e) {
    const cont = document.getElementById('teacherHistorial');
    if (cont) cont.innerHTML = `<p style="color:var(--danger);padding:12px">${e.message}</p>`;
  }

  // Alumnos de mis clases (todas las sesiones SENCE donde yo fui el teacher)
  try {
    // Obtener IDs de clases donde he sido profesor
    const sesSnap = await db.collection('teacherSessions')
      .where('teacherUid','==',currentUser.uid).get();
    const classIds = [...new Set(sesSnap.docs.map(d => d.data().classId))];
    const cont2 = document.getElementById('teacherAlumnosHist');
    if (!cont2) return;

    if (classIds.length === 0) {
      cont2.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Sin clases aún.</p></div>';
      return;
    }

    // Firestore permite max 10 en where-in
    const idsChunk = classIds.slice(0, 10);
    const attSnap = await db.collection('senceAttendance')
      .where('classId','in', idsChunk)
      .orderBy('createdAt','desc').get();

    if (attSnap.empty) {
      cont2.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Sin registros de alumnos aún.</p></div>';
      return;
    }

    cont2.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Alumno</th><th>RUN</th><th>Clase</th><th>Estado SENCE</th><th>Inicio</th></tr></thead>
          <tbody>
            ${attSnap.docs.map(d => {
              const a = d.data();
              return `<tr>
                <td>${escHtml(a.userName||a.userEmail||'—')}</td>
                <td><span style="font-family:'DM Mono';font-size:12px">${escHtml(a.runAlumno||'—')}</span></td>
                <td>${escHtml(a.classTitle||'—')}</td>
                <td>${estadoBadge(a)}</td>
                <td style="font-size:12px">${fmtDateTime(a.inicioSesion)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    const cont2 = document.getElementById('teacherAlumnosHist');
    if (cont2) cont2.innerHTML = `<p style="color:var(--danger);padding:12px">${e.message}</p>`;
  }
}

/* ════════════════════════════════════════════════
   COMUNICACIÓN SINCRÓNICA — CHAT DE CLASE EN VIVO
   Colección: liveClasses/{classId}/chat
   Funciona igual sin importar la plataforma de video
   usada (YouTube, Meet, Zoom, Teams, Jitsi o custom).
════════════════════════════════════════════════ */
function initClassChat(classId) {
  if (_chatListener) { _chatListener(); _chatListener = null; }
  const cont = document.getElementById('classChatMessages');
  if (!cont) return;
  _chatListener = db.collection('liveClasses').doc(classId).collection('chat')
    .orderBy('createdAt', 'asc').limitToLast(30)
    .onSnapshot(snap => {
      const cont2 = document.getElementById('classChatMessages');
      if (!cont2) return;
      if (snap.empty) {
        cont2.innerHTML = '<div class="empty-state" style="padding:20px"><p style="font-size:12.5px">Aún no hay mensajes. ¡Sé el primero en escribir!</p></div>';
        return;
      }
      cont2.innerHTML = snap.docs.map(d => {
        const m = d.data();
        const mine = m.uid === currentUser?.uid;
        return `<div class="chat-bubble ${mine?'mine':''}">
          <span class="cb-author">${escHtml(m.authorName||'Usuario')}${m.role==='admin'?' · Admin':m.role==='teacher'?' · Profesor':''}</span>
          ${escHtml(m.text||'')}
          <span class="cb-time">${m.createdAt ? fmtDateTime(m.createdAt) : 'enviando...'}</span>
        </div>`;
      }).join('');
      cont2.scrollTop = cont2.scrollHeight;
    }, e => { cont2 && (cont2.innerHTML = `<p style="color:var(--danger);padding:12px;font-size:12.5px">${e.message}</p>`); });
}
async function sendClassChat(classId) {
  const input = document.getElementById('classChatInput');
  const text  = input.value.trim();
  if (!text) return;
  input.value = '';
  try {
    await db.collection('liveClasses').doc(classId).collection('chat').add({
      text, uid: currentUser.uid,
      authorName: currentUser.displayName || currentUser.email,
      role: currentRole,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { toast('❌ No se pudo enviar el mensaje: ' + e.message, 'error'); }
}

/* ════════════════════════════════════════════════
   LIBRO DE CLASES ELECTRÓNICO
   Colección: libroClases
   Une clases online (liveClasses) y presenciales
   (registro manual) en un solo libro consolidado,
   con materia tratada y firma del docente.
════════════════════════════════════════════════ */
async function cargarEstadoLibroClase(classId) {
  const box = document.getElementById('libroClaseEstado');
  if (!box) return;
  try {
    const snap = await db.collection('libroClases').where('classId','==',classId).limit(1).get();
    if (!snap.empty) {
      const lc = snap.docs[0].data();
      document.getElementById('fc_materiaTratada').value = lc.materiaTratada || '';
      box.innerHTML = lc.firmaDocente?.firmado

  try {

    const payload = {
      classId, curso: cls.courseName||'', codigoCurso: cls.codigoCurso||'',

      materiaTratada: materia,

        fecha: firebase.firestore.Timestamp.now()

      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    if (!snap.empty) {
      await db.collection('libroClases').doc(snap.docs[0].id).update(payload);
    } else {
      payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('libroClases').add(payload);

/* ════════════════════════════════════════════════
   FIRMA DIGITAL — canvas reutilizable
   Guarda la firma como imagen base64 (PNG).
   Es una firma manuscrita capturada digitalmente,
   no una firma electrónica avanzada con certificado;
   sirve como evidencia de conformidad del firmante.
════════════════════════════════════════════════ */
function initSignaturePad(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a2e1e';
  let drawing = false, empty = true;
  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = e => { drawing = true; empty = false; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
  const move  = e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
  const end   = () => { drawing = false; };
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  _sigPadState[canvasId] = {
    clear: () => { ctx.clearRect(0,0,canvas.width,canvas.height); empty = true; },
    isEmpty: () => empty,
    getDataURL: () => canvas.toDataURL('image/png')
  };
}
function clearSignature(canvasId) { _sigPadState[canvasId]?.clear(); }

function generarPDFDeclaracion(titulo, texto, firmaDataUrl, nombreArchivo) {
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'letter' });
    doc.setFontSize(13); doc.setFont(undefined,'bold');
    doc.text('INASEP — Instituto Nacional de Seguridad Privada SpA', 20, 20);
    doc.setFontSize(11); doc.setFont(undefined,'normal');
    doc.text(titulo, 20, 28);
    doc.setFontSize(10);
    const lines = doc.splitTextToSize(texto, 170);
    doc.text(lines, 20, 40);
    let y = 40 + (lines.length * 5) + 10;
    if (firmaDataUrl) {
      doc.text('Firma:', 20, y);
      doc.addImage(firmaDataUrl, 'PNG', 20, y+3, 60, 25);
    }
    doc.setFontSize(8); doc.setTextColor(140);
    doc.text('Documento generado electrónicamente por el sistema de gestión INASEP.', 20, 280);
    doc.save(nombreArchivo);
  } catch(e) { toast('❌ No se pudo generar el PDF: ' + e.message, 'error'); }
}

async function cargarEstadoDeclaracionesParticipantes() {
  const curso = document.getElementById('dj_filtroCurso').value.trim();
  const cont = document.getElementById('djParticipantesList');
  if (!curso) return toast('⚠️ Escribe un curso para filtrar.', 'warning');
  cont.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>';
  try {
    // Clases del curso, y su asistencia (en tandas de 10 por límite de "in" de Firestore)
    const clasesSnap = await db.collection('liveClasses').where('courseName','==',curso).get();
    const classIds = clasesSnap.docs.map(d=>d.id);
    const alumnosSet = new Map();
    for (let i = 0; i < classIds.length; i += 10) {
      const chunk = classIds.slice(i, i+10);
      if (!chunk.length) continue;
      const attSnap = await db.collection('senceAttendance').where('classId','in',chunk).get();
      attSnap.docs.forEach(d => {
        const a = d.data();
        alumnosSet.set(a.userId||a.userEmail, { nombre:a.userName||a.userEmail, rut:a.runAlumno||'' });
      });
    }
    const djSnap = await db.collection('declaracionesJuradas').where('tipo','==','participante').where('curso','==',curso).get();
    const firmados = new Set(djSnap.docs.map(d=>d.data().userId||d.data().userEmail));
    if (alumnosSet.size === 0) {
      cont.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>No hay alumnos con asistencia registrada para ese curso.</p></div>';
      return;
    }
    cont.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Alumno</th><th>RUN</th><th>Declaración</th></tr></thead><tbody>
      ${[...alumnosSet.entries()].map(([uid,a]) => `<tr>
        <td>${escHtml(a.nombre)}</td><td>${escHtml(a.rut)}</td>
        <td>${firmados.has(uid) ? '<span class="badge badge-green">✅ Firmada</span>' : '<span class="badge badge-red">⛔ Pendiente</span>'}</td>

    </tbody></table></div>`;
  } catch(e) { cont.innerHTML = `<p style="color:var(--danger)">${e.message}</p>`; }
}

  const cont = document.getElementById('mdjHistorial');
  try {
    const snap = await db.collection('declaracionesJuradas').where('userId','==',currentUser.uid).orderBy('createdAt','desc').get();
    if (snap.empty) { cont.innerHTML = ''; return; }
    cont.innerHTML = `<h3 style="font-size:14px;margin-bottom:10px">Mis declaraciones firmadas</h3><div class="table-wrap"><table><thead><tr><th>Curso</th><th>Fecha</th></tr></thead><tbody>
      ${snap.docs.map(d=>{const x=d.data(); return `<tr><td>${escHtml(x.curso)}</td><td>${fmtDateTime(x.createdAt)}</td></tr>`;}).join('')}
    </tbody></table></div>`;
  } catch(e) { /* silencioso */ }
}

/* ════════════════════════════════════════════════
   COMUNICACIÓN ASINCRÓNICA — FORO / MENSAJERÍA
   Colección: foroMensajes
   Disponible en cualquier momento (no solo durante
   la clase en vivo), complementa el chat sincrónico.
════════════════════════════════════════════════ */
async function renderForo(mc) {
  mc.innerHTML = `
    <div class="page-header">
      <div><h2>💬 Foro / Mensajería del Curso</h2><div class="breadcrumb">Comunicación asincrónica — disponible en cualquier momento</div></div>
    </div>
    <div class="form-group">
      <label>Curso</label>
      <input type="text" id="foro_curso" placeholder="Ej: Guardia de Seguridad OS10" onkeydown="if(event.key==='Enter')cargarForo()">
      <small>Escribe el nombre exacto del curso y presiona Enter para ver/crear su hilo de mensajes.</small>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="cargarForo()">🔍 Ver Foro del Curso</button>
    <div id="foroContainer" style="margin-top:16px"></div>`;
}
async function cargarForo() {
  const curso = document.getElementById('foro_curso').value.trim();
  const cont  = document.getElementById('foroContainer');
  if (!curso) return toast('⚠️ Escribe el nombre del curso.', 'warning');
  if (_foroListener) { _foroListener(); _foroListener = null; }
  cont.innerHTML = `
    <div id="foroMensajes"><div class="empty-state"><div class="icon">⏳</div><p>Cargando mensajes...</p></div></div>
    <div class="card" style="margin-top:12px">
      <div class="form-group"><label>Escribe un mensaje o pregunta</label><textarea id="foroInput" rows="3" placeholder="Tu mensaje quedará visible para todos los del curso, sin necesidad de estar conectados a la vez..."></textarea></div>
      <button class="btn btn-primary btn-sm" onclick="enviarMensajeForo('${escHtml(curso).replace(/'/g,"\\'")}')">Publicar</button>
    </div>`;
  _foroListener = db.collection('foroMensajes').where('curso','==',curso)
    .orderBy('createdAt','asc').limitToLast(50)
    .onSnapshot(snap => {
      const box = document.getElementById('foroMensajes');
      if (!box) return;
      if (snap.empty) { box.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Aún no hay mensajes en este curso. ¡Escribe el primero!</p></div>'; return; }
      box.innerHTML = snap.docs.map(d => {
        const m = d.data();
        const roleBadge = m.role==='admin' ? 'badge-green' : m.role==='teacher' ? 'badge-orange' : 'badge-blue';
        const roleLabel = m.role==='admin' ? 'Admin' : m.role==='teacher' ? 'Profesor' : 'Alumno';
        return `<div class="forum-thread">
          <div class="ft-head"><div><span class="ft-author">${escHtml(m.authorName||'Usuario')}</span><span class="badge ${roleBadge} ft-role">${roleLabel}</span></div><span class="ft-time">${m.createdAt?fmtDateTime(m.createdAt):'enviando...'}</span></div>
          <div class="ft-body">${escHtml(m.mensaje||'')}</div>
        </div>`;
      }).join('');
    }, e => { box && (box.innerHTML = `<p style="color:var(--danger)">${e.message}</p>`); });
}
async function enviarMensajeForo(curso) {
  const input = document.getElementById('foroInput');
  const mensaje = input.value.trim();
  if (!mensaje) return;
  input.value = '';
  try {
    await db.collection('foroMensajes').add({
      curso, mensaje, role: currentRole,
      authorName: currentUser.displayName || currentUser.email,
      uid: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { toast('❌ No se pudo publicar: ' + e.message, 'error'); }
}
